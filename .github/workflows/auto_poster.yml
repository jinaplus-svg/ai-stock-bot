name: Auto Blogger Poster

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Category (news, it, stock, travel, food, auto)'
        required: true
        default: 'news'
      reference_url:
        description: 'Reference URL (Optional)'
        required: false
        default: ''
  schedule:
    # 봇이 자동으로 알아서 도는 스케줄 (UTC 기준 0, 4, 8, 12, 22시)
    - cron: '0 0,4,8,12,22 * * *'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 필요한 파이썬 패키지들을 모두 설치합니다
          pip install requests bs4 openai pillow google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client youtube-transcript-api

      - name: Run Auto Poster Script
        # ⭐️ 핵심: Secrets 창고에 있는 키들을 파이썬이 쓸 수 있게 꺼내줍니다!
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI: ${{ secrets.XAI }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          IT_BLOG_ID: ${{ secrets.IT_BLOG_ID }}
          FOOD_BLOG_ID: ${{ secrets.FOOD_BLOG_ID }}
          NEWS_BLOG_ID: ${{ secrets.NEWS_BLOG_ID }}
          STOCK_BLOG_ID: ${{ secrets.STOCK_BLOG_ID }}
          TRAVEL_BLOG_ID: ${{ secrets.TRAVEL_BLOG_ID }}
        run: |
          # 텔레그램에서 보낸 링크가 있으면 쓰고, 없으면 'auto' 모드로 작동
          python main_autoposter.py --category "${{ github.event.inputs.category || 'auto' }}" --reference_url "${{ github.event.inputs.reference_url || '' }}"
