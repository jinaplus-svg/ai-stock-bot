name: Content Schedule (Daily Auto Publish - All Categories)

# 🌟 [v3] 예전엔 크론 1번(07:00 KST)에 5개 카테고리를 한 잡 안에서 5초 간격으로 전부 발행했음 —
# 5개 블로그가 몇 분 사이에 한꺼번에 올라와서 부자연스럽다는 피드백으로, 카테고리별로 크론을
# 30분씩 나눠서 각 트리거가 자기 카테고리 하나만 발행하도록 분리.
on:
  schedule:
    - cron: '0 22 * * *'    # 07:00 KST -> stock
    - cron: '30 22 * * *'   # 07:30 KST -> it
    - cron: '0 23 * * *'    # 08:00 KST -> food
    - cron: '30 23 * * *'   # 08:30 KST -> news
    - cron: '0 0 * * *'     # 09:00 KST -> travel
  workflow_dispatch:
    inputs:
      category:
        description: "발행할 카테고리 (all이면 5개 전부 순차 발행)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - stock
          - it
          - food
          - news
          - travel

permissions:
  contents: write  # 중복방지 이력(longform_creator_history.json, used_source_urls.json) 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine category from trigger
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 22 * * *") echo "categories=stock" >> "$GITHUB_OUTPUT" ;;
              "30 22 * * *") echo "categories=it" >> "$GITHUB_OUTPUT" ;;
              "0 23 * * *") echo "categories=food" >> "$GITHUB_OUTPUT" ;;
              "30 23 * * *") echo "categories=news" >> "$GITHUB_OUTPUT" ;;
              "0 0 * * *") echo "categories=travel" >> "$GITHUB_OUTPUT" ;;
              *) echo "categories=" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            input_cat="${{ github.event.inputs.category }}"
            if [ -z "$input_cat" ] || [ "$input_cat" = "all" ]; then
              echo "categories=stock it food news travel" >> "$GITHUB_OUTPUT"
            else
              echo "categories=$input_cat" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run category
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI: ${{ secrets.XAI }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          IT_BLOG_ID: ${{ secrets.IT_BLOG_ID }}
          FOOD_BLOG_ID: ${{ secrets.FOOD_BLOG_ID }}
          NEWS_BLOG_ID: ${{ secrets.NEWS_BLOG_ID }}
          STOCK_BLOG_ID: ${{ secrets.STOCK_BLOG_ID }}
          TRAVEL_BLOG_ID: ${{ secrets.TRAVEL_BLOG_ID }}
        run: |
          for cat in ${{ steps.pick.outputs.categories }}; do
            echo "===== $cat ====="
            python main_autoposter.py --category "$cat" --with_longform || echo "⚠️ $cat 실패, 다음 카테고리로 계속"
            sleep 5
          done

      - name: Commit dedup history
        run: |
          git config user.name "content-schedule-bot"
          git config user.email "content-schedule-bot@users.noreply.github.com"
          git add longform_creator_history.json used_source_urls.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update dedup history [skip ci]"
          git push || true
