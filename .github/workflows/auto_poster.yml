name: Integrated Blog Auto Poster

on:
  schedule:
    - cron: '0 23 * * *' # IT (오전 8시)
    - cron: '0 3 * * *'  # 맛집 (오후 12시)
  workflow_dispatch:
    inputs:
      category:
        description: 'it, food, news, stock, youtube'
        required: true
      topic:
        description: '주제 (또는 영상 제목)'
        required: true
      reference_url:
        description: '참조할 외부 URL'
        required: false
        default: ''

jobs:
  run-autoposter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install openai google-api-python-client google-auth-oauthlib requests Pillow
      - name: Run Autoposter
        run: |
          python main_autoposter.py \
            --category "${{ github.event.inputs.category || (github.event.schedule == '0 23 * * *' && 'it' || 'food') }}" \
            --topic "${{ github.event.inputs.topic || '오늘의 이슈' }}" \
            --reference_url "${{ github.event.inputs.reference_url }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI: ${{ secrets.XAI }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          IT_BLOG_ID: ${{ secrets.IT_BLOG_ID }}
          FOOD_BLOG_ID: ${{ secrets.FOOD_BLOG_ID }}
          NEWS_BLOG_ID: ${{ secrets.NEWS_BLOG_ID }}
          STOCK_BLOG_ID: ${{ secrets.STOCK_BLOG_ID }}
          YOUTUBE_BLOG_ID: ${{ secrets.YOUTUBE_BLOG_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
