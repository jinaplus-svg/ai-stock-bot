name: Auto Blogger Poster

on:
  schedule:
    # 봇이 스스로 포스팅하는 시간 (UTC 기준. 23시=한국 아침 8시, 4시=한국 오후 1시, 9시=한국 오후 6시)
    - cron: '0 23,4,9 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '포스팅 카테고리 (news, it, stock, travel, food)'
        required: true
        default: 'auto'
      reference_url:
        description: '참고할 기사 또는 유튜브 URL (선택사항)'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai google-api-python-client google-auth-oauthlib requests Pillow beautifulsoup4 youtube-transcript-api

      - name: Run Auto Poster Script
        env:
          # AI 및 기본 유틸리티 키
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI: ${{ secrets.XAI }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          
          # 쌍끌이 검색 엔진(Tavily + Naver) 필수 키
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          
          # 구글 블로그 카테고리별 ID
          IT_BLOG_ID: ${{ secrets.IT_BLOG_ID }}
          FOOD_BLOG_ID: ${{ secrets.FOOD_BLOG_ID }}
          NEWS_BLOG_ID: ${{ secrets.NEWS_BLOG_ID }}
          STOCK_BLOG_ID: ${{ secrets.STOCK_BLOG_ID }}
          TRAVEL_BLOG_ID: ${{ secrets.TRAVEL_BLOG_ID }}
        run: |
          python main_autoposter.py --category "${{ github.event.inputs.category || 'auto' }}" --reference_url "${{ github.event.inputs.reference_url || '' }}"
