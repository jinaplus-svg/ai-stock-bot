name: Soloitems Pilot (Coupang Auto Blog)

on:
  schedule:
    - cron: '0 6 * * *'   # 매일 15:00 KST (UTC 06:00)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run soloitems auto pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI: ${{ secrets.XAI }}
          SOLO_GOOGLE_TOKEN: ${{ secrets.SOLO_GOOGLE_TOKEN }}
          SOLO_BLOG_ID: ${{ secrets.SOLO_BLOG_ID }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u auto_soloitems.py
