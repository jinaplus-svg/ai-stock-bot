name: Calculator Pilot (Soloitems Life-Utility Posts)

# 🌟 schedule: 트리거는 이 저장소에서 실제로 안 돌아간 전례가 있어(content_schedule.yml
# 2026-09-11 미발동 사고) workflow_dispatch만 쓰고, 로컬 PC의 Windows 작업 스케줄러가
# 대신 주기적으로 호출한다(자세한 내용은 content_schedule.yml 주석 참고).
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run calculator auto-post pipeline
        env:
          SOLO_GOOGLE_TOKEN: ${{ secrets.SOLO_GOOGLE_TOKEN }}
          SOLO_BLOG_ID: ${{ secrets.SOLO_BLOG_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u auto_calculator_posts.py
