name: Stock Closing Bet Bot

on:
  schedule:
    # UTC 06:40 = 한국 시간 15:40 (오후 3시 40분)
    # 월~금(1-5)만 실행
    - cron: '40 6 * * 1-5'
  
  # 수동 실행 버튼
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # [중요 변경] requirements.txt 파일 없이 여기서 직접 설치합니다!
    # feedparser가 꼭 포함되어 있어야 합니다.
    - name: 필수 라이브러리 설치
      run: |
        pip install finance-datareader pandas requests lxml feedparser

    - name: 종가베팅 봇 실행
      env:
        # 깃허브 Secrets 설정 (Tavily 삭제함)
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python finalbet_full.py
