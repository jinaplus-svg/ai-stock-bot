name: Integrated Blog Auto Poster - DISABLED

# 자동 블로그 중복 발행 방지를 위해 자동 실행(push/schedule)을 비활성화했습니다.
# 다시 수동으로만 실행하고 싶으면 아래 workflow_dispatch 주석을 해제하세요.

on:
  workflow_dispatch:
    inputs:
      disabled_notice:
        description: 'This workflow is disabled to prevent duplicate blog posts.'
        required: false
        default: 'disabled'

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: |
          echo "This blog auto poster workflow is disabled to prevent duplicate posts."
          echo "No blog article will be generated or posted."
